<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Operators - Action on Data

        //1. Arthmetic Op : + , - , / , * , %(Remainder)

        let a = 10
        let b = 5

        console.log(a+b)
        console.log(a-b)
        console.log(a*b)
        console.log(a/b)
        console.log(a%b)


        //2.Assigment - Assign The value - =

        let score = 2

        console.log(score +=  1)

        let x = 5
        x++  //Increase value by 1
        console.log(x)

        //3. Comaparsion Op - Boolean
        console.log(14 > 12)   //T
 
        console.log(12 < 5)  //F

        console.log(10 >= 10)  //T
        console.log(5 <= 5)   //T

        // == Left and Right Value Should Be Same
        console.log(100 == "100")

        //  === Left and Right Value and Data Type Should Be Same
        console.log(10 === "10")
        

        // Logical  Operator
        // AND- Both Condition True - Output True - &&
        let isMember = true
        let TotalBill = 800

        console.log(" Discount Eligble " ,       isMember && TotalBill >= 500 )



        //OR-Atleast One Codnition True - Output  - ||
        let loginStatus = true

        let NetflixSub = false

        console.log("Can I Use Netflix App " , loginStatus || NetflixSub )

    


        //Not - Opp Value-/ Flip - !

        let paymentStatus = false

        console.log(!paymentStatus)

        let   isFollow = false

        console.log(!isFollow)
    </script>
</body>
</html>
