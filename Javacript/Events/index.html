<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <button id="btn">Add To cart</button>
     <p id="rsp"></p>

     <input id="myinput" placeholder="Searchh.....">


    <script>
        //Events - Action Performed By User on Webpage - click , type , scroll , mouse 

        const button =    document.getElementById("btn")
        const p = document.getElementById("rsp")

        const inputTag = document.getElementById("myinput")

        //addEventLisntener("type of event", function-Task)

        button.addEventListener('click',function(){
             p.textContent = "Product Added To Cart"
        })

        inputTag.addEventListener('change', function(abc){
            console.log(' Input Value Changing ', abc.target.value)
        })
    </script>
</body>
</html>
