<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Data Type - Diffrent Types of Data
         
        //1. String - Anything Under " " or '' It is String - When You have To write a text format data

        let name = 'Guru'

        console.log(  typeof(name)  )

        let password = "1234"

        console.log(typeof(password))


        //2. Number - +ve,-ve, decimal No

        let temp = -22.03

        console.log(typeof(temp))

        //3. Blooean - true or false
        let LoginStatus = true

        let NetflixSub = false

        console.log(typeof(LoginStatus))

        console.log(typeof(NetflixSub))


        //4 Undefined - When No Value is Assigned

        let deliveryCharge 

        console.log(typeof(deliveryCharge))


        //Multiple Data 

        //1. Array - Store Multiple Data at the same time and diffrent data types as well
        //Symbol - [   ]
        //Index No (Position No) of data

        let students = ["Aarthi" , "Sathis", "Vamsi" , "Abhijit" , 1234 , true]

        console.log(students)
        console.log(students[3])

        console.log(students[5])


        //2. Object - Collection of Data
        // Symbol - {}
        //key:value pair

        let employee = {
            name:"Nidhi" ,
            email:"Nidhi@gmail.com" ,
            LoginStatus:true
        }
        console.log(employee)

        console.log(employee.LoginStatus)

        console.log(employee.name)



        //Functions - Use To Do A Specific Task 

        function Greet(){
            //Body of Funcion - Instruction-Taks

            alert("Good Morning Guest")    //Pop up msg Output

            console.log("Good eveing user")
        }
        
        Greet()

    </script>
</body>
</html>
