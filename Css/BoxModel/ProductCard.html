<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
           body{
            display: flex;
            justify-content: center;
            gap: 25px;
            align-items: center;
            height: 100vh;
            flex-wrap: wrap;
           }


         .product{
            border: 1px solid black;
            width: 250px;
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 4px 4px 8px black;
            margin: 15px;
         }

         div img{
            width: 100%;
            object-fit: cover;
            border-radius: 12px;
         }

         div h2{
            font-family: Arial, Helvetica, sans-serif;
            text-decoration: underline;
            color: rebeccapurple;
         }

         div p{
            font-size: 20px;
            font-family:fantasy;
         }

         div button{
            background-color: orange;
            border: none;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
         }

         .product:hover{
            background-color: rgb(244, 223, 194);
            transition: 2s;

            transform: scale(1.02);
            /* transform: translateX(100px);
            transform: rotate(360deg); */
         }
    </style>
</head>
<body>
    <div class="product">
      <img src="https://images.pexels.com/photos/33797585/pexels-photo-33797585.jpeg" height="150">
      <h2>Mobile</h2>
      <p>Rs30,000</p>
      <button>Add To Cart</button>
    </div>

     <div class="product">
      <img src="https://images.pexels.com/photos/12920900/pexels-photo-12920900.jpeg"  height="150" >
      <h2>Headphone</h2>
      <p>Rs9,0000</p>
      <button>Add To Cart</button>
    </div>


     <div class="product">
      <img src="https://images.pexels.com/photos/5793947/pexels-photo-5793947.jpeg"  height="150" >
      <h2>Laptop</h2>
      <p>Rs50,000</p>
      <button>Add To Cart</button>
    </div>
</body>
</html>
